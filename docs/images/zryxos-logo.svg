<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 现代渐变：参考 Claude/Anthropic 的温暖色调 -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>

    <!-- 辅助渐变 -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景：圆角方形，类似 Claude -->
  <rect x="50" y="50" width="300" height="300" rx="80" fill="url(#mainGrad)"/>

  <!-- 主图形：三个圆形节点连接成 Z 形 -->
  <!-- 参考 LangChain 的链条概念 + OpenAI 的几何美感 -->

  <!-- 上方节点 -->
  <g transform="translate(140, 140)">
    <circle r="40" fill="#ffffff" opacity="0.95"/>
    <circle r="20" fill="url(#accentGrad)"/>
  </g>

  <!-- 中间节点 -->
  <g transform="translate(200, 200)">
    <circle r="45" fill="#ffffff" opacity="0.95"/>
    <circle r="22" fill="url(#accentGrad)"/>
    <!-- Z 字标识在中心 -->
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">Z</text>
  </g>

  <!-- 下方节点 -->
  <g transform="translate(260, 260)">
    <circle r="40" fill="#ffffff" opacity="0.95"/>
    <circle r="20" fill="url(#accentGrad)"/>
  </g>

  <!-- 连接线：圆角，参考 LangChain 的流畅感 -->
  <g opacity="0.4">
    <line x1="140" y1="140" x2="200" y2="200"
          stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="200" y1="200" x2="260" y2="260"
          stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 轨道环：暗示 OS/系统概念 -->
  <g opacity="0.15">
    <circle cx="200" cy="200" r="130" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="200" cy="200" r="145" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="8,8"/>
  </g>
</svg>
