<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 温暖的渐变色 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>

    <!-- 柔和阴影 -->
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆形背景 -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)"/>

  <!-- 可爱的机器人 Agent - 主角色 -->
  <g transform="translate(200, 180)">
    <!-- 身体 - 圆角矩形 -->
    <rect x="-50" y="-20" width="100" height="100" rx="25" fill="#ffffff" filter="url(#softShadow)"/>

    <!-- 头部 - 圆形 -->
    <circle cx="0" cy="-60" r="45" fill="#ffffff" filter="url(#softShadow)"/>

    <!-- 可爱的大眼睛 -->
    <ellipse cx="-15" cy="-65" rx="12" ry="15" fill="#6366f1"/>
    <ellipse cx="15" cy="-65" rx="12" ry="15" fill="#6366f1"/>
    <!-- 眼睛高光 -->
    <circle cx="-12" cy="-70" r="5" fill="#ffffff"/>
    <circle cx="18" cy="-70" r="5" fill="#ffffff"/>

    <!-- 可爱的微笑 -->
    <path d="M -20,-45 Q 0,-35 20,-45" stroke="#a855f7" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- 天线 - 更卡通 -->
    <line x1="0" y1="-105" x2="0" y2="-120" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-125" r="8" fill="#fbbf24"/>
    <circle cx="0" cy="-125" r="4" fill="#ffffff"/>

    <!-- 字母 Z 在胸口 -->
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="40" font-weight="bold"
          fill="#6366f1" text-anchor="middle" dominant-baseline="middle">Z</text>

    <!-- 小手臂 -->
    <rect x="-70" y="0" width="15" height="40" rx="8" fill="#ffffff" filter="url(#softShadow)"/>
    <rect x="55" y="0" width="15" height="40" rx="8" fill="#ffffff" filter="url(#softShadow)"/>
    <circle cx="-62" cy="45" r="10" fill="#fbbf24"/>
    <circle cx="62" cy="45" r="10" fill="#fbbf24"/>
  </g>

  <!-- 小伙伴 Agent 们（更小更可爱） -->
  <!-- 左边小伙伴 -->
  <g transform="translate(80, 280)">
    <circle r="25" fill="#ffffff" filter="url(#softShadow)"/>
    <circle cx="-8" cy="-3" r="5" fill="#6366f1"/>
    <circle cx="8" cy="-3" r="5" fill="#6366f1"/>
    <circle cx="-6" cy="-5" r="2" fill="#ffffff"/>
    <circle cx="10" cy="-5" r="2" fill="#ffffff"/>
    <path d="M -10,8 Q 0,14 10,8" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="-25" x2="0" y2="-32" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="-36" r="4" fill="#fbbf24"/>
  </g>

  <!-- 右边小伙伴 -->
  <g transform="translate(320, 280)">
    <circle r="25" fill="#ffffff" filter="url(#softShadow)"/>
    <circle cx="-8" cy="-3" r="5" fill="#6366f1"/>
    <circle cx="8" cy="-3" r="5" fill="#6366f1"/>
    <circle cx="-6" cy="-5" r="2" fill="#ffffff"/>
    <circle cx="10" cy="-5" r="2" fill="#ffffff"/>
    <path d="M -10,8 Q 0,14 10,8" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="-25" x2="0" y2="-32" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="-36" r="4" fill="#fbbf24"/>
  </g>

  <!-- 连接线 - 虚线波浪 -->
  <path d="M 95,270 Q 140,260 200,250" stroke="#ffffff" stroke-width="3"
        stroke-dasharray="6,6" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 305,270 Q 260,260 200,250" stroke="#ffffff" stroke-width="3"
        stroke-dasharray="6,6" fill="none" opacity="0.5" stroke-linecap="round"/>

  <!-- 装饰星星 -->
  <g opacity="0.8">
    <text x="50" y="100" font-size="25" fill="#fbbf24">✨</text>
    <text x="330" y="120" font-size="20" fill="#fbbf24">✨</text>
    <text x="360" y="200" font-size="18" fill="#ffffff">⭐</text>
    <text x="30" y="220" font-size="18" fill="#ffffff">⭐</text>
  </g>
</svg>
